types = ["PartDesign::Revolution", "PartDesign::Groove"]
variants = ["PartDesign::Revolution", "PartDesign::Groove"]

[template.hide_if]
Midplane = "SideType"

[template.group_as]
AllowMultiFace = "Part Design"

[[template.couple]]
value = "StartOffset"
mode = "StartType"
zero = "Profile plane"
nonzero = "Offset"

[template.choices]
"One side" = "One side"
"Two sides" = "Two sides"
Symmetric = "Symmetric"
Angle = "Angle"
ThroughAll = "Through all"
UpToLast = "To last"
UpToFirst = "To first"
UpToFace = "Up to face"
UpToShape = "Up to shape"
Union = "Add"
Subtraction = "Cut"
Common = "Keep common"

[[template.card]]
title = "Operation"
heading = false
items = [
    { prop = ":variant", label = "Operation", bare = true, editor = "segmented" },
]

[[template.card]]
title = "Profile"
heading = false
items = [
    { prop = "Profile", label = "Sketch" },
    { prop = "ReferenceAxis", label = "Axis", trail = "Reversed" },
]

[[template.card]]
title = "Extent"
heading = false
items = [
    { prop = "SideType", bare = true, editor = "segmented" },
]

[[template.card.column]]
title = "First side"
items = [
    { prop = "Angle", lead = "Type", show_if = { Type = "Angle" } },
    { prop = "UpToFace", prompt = "Select a face", label = "Up to", lead = "Type", show_if = { Type = "UpToFace" } },
    { prop = "UpToShape", prompt = "Select a shape or faces", label = "Up to", lead = "Type", show_if = { Type = "UpToShape" } },
    { prop = "Type", label = "Up to", editor = "dropdown", omit_if = { "?TwoAngles" = "SideType" }, show_if = { Type = ["UpToLast", "UpToFirst", "ThroughAll"] } },
]

[[template.card.column]]
title = "Second side"
show_if = { SideType = "Two sides" }
items = [
    { prop = "Angle2", label = "Angle", lead = "Type2", show_if = { Type2 = "Angle" } },
    { prop = "UpToFace2", prompt = "Select a face", label = "Up to", lead = "Type2", show_if = { Type2 = "UpToFace" } },
    { prop = "UpToShape2", prompt = "Select a shape or faces", label = "Up to", lead = "Type2", show_if = { Type2 = "UpToShape" } },
    { prop = "Type2", label = "Up to", editor = "dropdown", omit_if = { "?TwoAngles" = "SideType" }, show_if = { Type2 = ["UpToLast", "UpToFirst", "ThroughAll"] } },
]

[[template.card]]
title = "Start"
heading = false
items = [
    [{ prop = "StartOffset", label = "Start offset" },
     { prop = "StartType", bare = true, editor = "segmented", labels = ["Profile", "Reference"] }],
    { prop = "StartReference", prompt = "Select a face or plane", label = "Reference", show_if = { StartType = "Reference" } },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]

# Additive and subtractive lofts: the profile, the sections it passes
# through in order, how the surface runs between them, and the result.
[[template]]
id = "pd-loft"
types = ["PartDesign::AdditiveLoft", "PartDesign::SubtractiveLoft"]
variants = ["PartDesign::AdditiveLoft", "PartDesign::SubtractiveLoft"]
# Inherited from sketch-based features, but unused by a loft (the wiki
# lists them as not applicable).
hide = ["Midplane", "Reversed", "AllowMultiFace", "UpToFace", "UpToFace2",
        "UpToShape", "UpToShape2"]

[template.choices]
Union = "Add"
Subtraction = "Cut"
Common = "Keep common"

[[template.card]]
title = "Operation"
heading = false
items = [
    { prop = ":variant", label = "Operation", bare = true, editor = "segmented" },
]

[[template.card]]
title = "Profile"
heading = false
items = [
    { prop = "Profile", label = "Profile", whole = true },
    { prop = "Sections", label = "Sections", whole = true },
]

[[template.card]]
title = "Shape"
heading = false
items = [
    { prop = "Ruled", label = "Surface", editor = "segmented", labels = ["Smooth", "Ruled"] },
    { prop = "Closed", label = "Closed", editor = "switch" },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]

# Additive and subtractive pipes: the profile swept along a path, how it
# turns at corners and along the way, optional further sections, and the
# result. The pipe writes its settings to the feature as they change.
[[template]]
id = "pd-pipe"
types = ["PartDesign::AdditivePipe", "PartDesign::SubtractivePipe"]
variants = ["PartDesign::AdditivePipe", "PartDesign::SubtractivePipe"]
# Inherited from sketch-based features, but unused by a pipe.
hide = ["Midplane", "Reversed", "UpToFace", "UpToFace2", "UpToShape",
        "UpToShape2"]

[template.group_as]
AllowMultiFace = "Part Design"

[template.choices]
Constant = "One profile"
Multisection = "Several"
Transformed = "Transformed"
"Right corner" = "Right corner"
"Round corner" = "Round corner"
Standard = "Standard"
Fixed = "Fixed"
Frenet = "Frenet"
Auxiliary = "Guide path"
Binormal = "Binormal"
Union = "Add"
Subtraction = "Cut"
Common = "Keep common"

[[template.card]]
title = "Operation"
heading = false
items = [
    { prop = ":variant", label = "Operation", bare = true, editor = "segmented" },
]

[[template.card]]
title = "Path"
heading = false
items = [
    { prop = "Profile", label = "Profile", whole = true },
    { prop = "Spine", label = "Path" },
    { prop = "SpineTangent", label = "Tangent edges", editor = "switch" },
]

[[template.card]]
title = "Sections"
heading = false
items = [
    # Linear, S-shape and Interpolation do not work yet (the wiki says);
    # every pipe has Mode, so they are always left out.
    { prop = "Transformation", label = "Sections", editor = "segmented", omit_if = { Linear = "Mode", "S-shape" = "Mode", Interpolation = "Mode" } },
    { prop = "Sections", label = "Through", whole = true, show_if = { Transformation = "Multisection" } },
    { prop = "Transition", label = "Corners", editor = "dropdown" },
]

[[template.card]]
title = "Orientation"
heading = false
items = [
    { prop = "Mode", label = "Orientation", editor = "dropdown" },
    { prop = "AuxiliarySpine", label = "Guide path", show_if = { Mode = "Auxiliary" } },
    { prop = "AuxiliarySpineTangent", label = "Tangent edges", editor = "switch", show_if = { Mode = "Auxiliary" } },
    { prop = "AuxiliaryCurvilinear", label = "Curvilinear", editor = "switch", show_if = { Mode = "Auxiliary" } },
    { prop = "Binormal", show_if = { Mode = "Binormal" } },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]

# Additive and subtractive helices: the profile swept along a helix about
# an axis (reversed beside it), the helix by the two or three values its
# mode takes (FreeCAD derives the rest, read-only), and the result. The
# helix writes its settings to the feature as they change.
[[template]]
id = "pd-helix"
types = ["PartDesign::AdditiveHelix", "PartDesign::SubtractiveHelix"]
variants = ["PartDesign::AdditiveHelix", "PartDesign::SubtractiveHelix"]
# Inherited from sketch-based features, but unused by a helix (the wiki
# lists them as not used).
hide = ["Midplane", "AllowMultiFace", "UpToFace", "UpToFace2", "UpToShape",
        "UpToShape2"]

[template.choices]
Union = "Add"
Subtraction = "Cut"
Common = "Keep common"
pitch-height-angle = "Pitch and height"
pitch-turns-angle = "Pitch and turns"
height-turns-angle = "Height and turns"
height-turns-growth = "Height, turns and growth"

[[template.card]]
title = "Operation"
heading = false
items = [
    { prop = ":variant", label = "Operation", bare = true, editor = "segmented" },
]

[[template.card]]
title = "Profile"
heading = false
items = [
    { prop = "Profile", label = "Sketch" },
    { prop = "ReferenceAxis", label = "Axis", trail = "Reversed" },
]

[[template.card]]
title = "Helix"
heading = false
items = [
    { prop = "Mode", label = "Defined by", editor = "dropdown" },
    { prop = "Pitch", show_if = { Mode = ["pitch-height-angle", "pitch-turns-angle"] } },
    { prop = "Height", show_if = { Mode = ["pitch-height-angle", "height-turns-angle", "height-turns-growth"] } },
    { prop = "Turns", show_if = { Mode = ["pitch-turns-angle", "height-turns-angle", "height-turns-growth"] } },
    { prop = "Angle", label = "Cone angle", narrow = true, show_if = { Mode = ["pitch-height-angle", "pitch-turns-angle", "height-turns-angle"] } },
    { prop = "Growth", narrow = true, show_if = { Mode = "height-turns-growth" } },
    { prop = "LeftHanded", label = "Turning", editor = "segmented", labels = ["Right hand", "Left hand"] },
]

[[template.card]]
title = "Result"
heading = false
items = [
    { prop = "Tolerance", label = "Fusion tolerance", narrow = true },
    { prop = "Refine", label = "Merge faces", editor = "switch" },
]

